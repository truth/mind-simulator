<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>RoboMaster TT 模拟器</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%23e4572e%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <header>
    <div class="brand"><span class="logo">TT</span> RoboMaster TT 模拟器 <small>Mind+ 实时模式</small></div>
    <div class="toolbar">
      <label>场景 <select id="scene"></select></label>
      <div class="seg" id="camModes">
        <button data-cam="orbit" class="active" title="鼠标左键旋转 / 右键平移 / 滚轮缩放">环绕</button>
        <button data-cam="chase" title="跟在飞机后方">跟随</button>
        <button data-cam="fpv" title="飞机前置摄像头视角">第一视角</button>
      </div>
      <label>速度 <select id="timescale">
        <option value="0.5">0.5×</option><option value="1" selected>1×</option>
        <option value="2">2×</option><option value="4">4×</option>
      </select></label>
      <button id="pause">暂停</button>
      <button id="reset">重置</button>
      <button id="charge">充满电</button>
      <label class="chk"><input type="checkbox" id="trail" checked> 轨迹</label>
      <label class="chk"><input type="checkbox" id="tofBeam" checked> ToF 光束</label>
      <label class="chk" title="W/S 前后 A/D 左右 ↑/↓ 升降 Q/E 旋转 T 起飞 L 降落"><input type="checkbox" id="keyboard"> 键盘遥控</label>
    </div>
    <div id="conn" class="badge off">未连接</div>
  </header>

  <main>
    <section id="viewport">
      <canvas id="scene3d" tabindex="0"></canvas>
      <div id="pip"><canvas id="pipCanvas" width="320" height="180"></canvas><span id="pipLabel">TT 摄像头</span></div>
      <div id="hud"></div>
      <div id="hint">Shift + 点击地面：放置障碍物</div>
    </section>

    <aside>
      <div id="droneTabs" class="tabs"></div>

      <div class="card">
        <h3>连接</h3>
        <div class="kv"><span>UDP 地址</span><b id="ip">-</b></div>
        <div class="kv"><span>手机 App</span><b id="lanAddr" title="在 Android App 中填写此地址">-</b></div>
        <div class="kv"><span>客户端</span><b id="client">等待 Mind+ 连接…</b></div>
        <div class="kv"><span>SDK 模式</span><b id="sdk">-</b></div>
        <div class="kv"><span>正在执行</span><b id="task">-</b></div>
      </div>

      <div class="card">
        <h3>飞行状态</h3>
        <div class="grid">
          <div><span>电量</span><b id="bat">-</b></div>
          <div><span>温度</span><b id="temp">-</b></div>
          <div><span>高度</span><b id="height">-</b></div>
          <div><span>航向</span><b id="yaw">-</b></div>
          <div><span>X / Y</span><b id="xy">-</b></div>
          <div><span>飞行时间</span><b id="ftime">-</b></div>
          <div><span>下视 ToF</span><b id="tofDown">-</b></div>
          <div><span>挑战卡</span><b id="mid">-</b></div>
          <div><span>速度设定</span><b id="speed">-</b></div>
          <div><span>状态</span><b id="fstate">-</b></div>
        </div>
      </div>

      <div class="card">
        <h3>ESP32 扩展模块</h3>
        <div class="ext">
          <canvas id="matrix2d" width="160" height="160"></canvas>
          <div class="ext-side">
            <div class="led-wrap"><div id="led2d"></div><span>顶部 RGB 灯</span></div>
            <div class="tof">
              <span>前向 ToF</span><b id="tofFront">-</b>
              <div class="bar"><div id="tofBar"></div></div>
            </div>
          </div>
        </div>
      </div>

      <div class="card console">
        <h3>SDK 控制台 <small>（不用 Mind+ 也能直接测试）</small></h3>
        <div class="quick">
          <button data-cmd="takeoff">起飞</button>
          <button data-cmd="land">降落</button>
          <button data-cmd="forward 50">前进50</button>
          <button data-cmd="back 50">后退50</button>
          <button data-cmd="cw 90">右转90</button>
          <button data-cmd="flip f">前翻</button>
          <button data-cmd="EXT mled l r 1.5 Mind+">点阵滚动</button>
          <button data-cmd="EXT led br 1 0 255 255">呼吸灯</button>
          <button data-cmd="emergency" class="danger">急停</button>
        </div>
        <form id="cmdForm"><input id="cmdInput" placeholder="输入 SDK 指令，如 go 100 0 50 60，回车发送" autocomplete="off"></form>
        <div id="log"></div>
      </div>
    </aside>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
